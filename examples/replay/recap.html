  drift(b){const items=b.items||[];const c={asplanned:0,changed:0,skipped:0,added:0};items.forEach(d=>{const k=(d.status||'').replace('-','');if(c[k]!=null)c[k]++;});const mk={asplanned:'✓',changed:'≠',skipped:'✗',added:'+'};const sum=`<div class="driftsum"><span class="pill st asplanned">${mk.asplanned} ${c.asplanned} as planned</span><span class="pill st changed">${mk.changed} ${c.changed} changed</span><span class="pill st skipped">${mk.skipped} ${c.skipped} skipped</span><span class="pill st added">${mk.added} ${c.added} unplanned</span></div>`;return sum+`<div class="card"><div class="bd drift">${items.map(d=>{const k=(d.status||'asplanned').replace('-','');return `<div class="row"><div class="mk">${mk[k]||'•'}</div><div style="flex:1">${d.planned?`<div class="pl">Planned: ${esc(d.planned)}</div>`:''}${d.actual?`<div class="ac">Actual: ${esc(d.actual)}</div>`:''}${d.note?`<div class="reasons" style="color:var(--muted);font-size:12.5px;margin-top:3px">${esc(d.note)}</div>`:''}</div><span class="st ${k}">${esc(d.status||'')}</span></div>`;}).join('')}</div></div>`;},
  wireframe(b){const h=esc(b.html);return `<div class="card wf"><div class="hd">${esc(b.title||'Wireframe')}</div><div class="bd"><iframe sandbox="" srcdoc="${h}" style="height:${b.height||420}px"></iframe></div></div>`;},
  questions(b){return (b.items||[]).map(q=>`<div class="q"><div class="qq">${esc(q.q)}</div>${q.options&&q.options.length?`<div class="opts">Options: ${q.options.map(esc).join(' · ')}</div>`:''}${q.recommendation?`<div class="rec">Recommended: ${esc(q.recommendation)}</div>`:''}</div>`).join('');},
  tabs(b){const id='tabs'+Math.random().toString(36).slice(2,7);const bar=(b.tabs||[]).map((t,i)=>`<button class="tabbtn ${i===0?'active':''}" data-t="${id}" data-i="${i}">${esc(t.label)}</button>`).join('');const panes=(b.tabs||[]).map((t,i)=>`<div class="tabpane ${i===0?'active':''}" id="${id}-${i}">${(t.blocks||[]).map(render).join('')}</div>`).join('');return `<div class="tabs">${`<div class="tabbar">${bar}</div>`}${panes}</div>`;},
  divider(){return '<hr style="border:none;border-top:1px solid var(--border);margin:30px 0">';}
};
function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'s'+Math.random().toString(36).slice(2,6);}
function render(b){const fn=R[b.type];const inner=fn?fn(b):`<div class="callout danger">Unknown block type: <code>${esc(b.type)}</code></div>`;const heading=(b.type==='heading');const wid=heading?'':(b.id||b._id);return `<div class="block${heading?'':' annotatable'}"${wid?` id="${wid}"`:''} data-bid="${b.id||b._id}"><button class="annobtn" title="Add note">✎</button>${inner}</div>`;}

/* ---------- build page ---------- */
function build(){
  document.title=DATA.title||'Artifact';
  $('#brand').textContent=(DATA.kind||'').toUpperCase()||'Artifact';
  const c=$('#content');
  const blocks=(DATA.blocks||[]);blocks.forEach((b,i)=>b._id=b._id||('b'+i));
  // hero
  const meta=DATA.meta||{};
  const chips=Object.entries(meta).filter(([,v])=>v).map(([k,v])=>`<span class="chip"><b>${esc(k)}</b> ${esc(v)}</span>`).join('');
  c.appendChild(el('div','hero',`<span class="kind">${esc(DATA.kind||'document')}</span><h1>${esc(DATA.title||'Untitled')}</h1>${DATA.subtitle?`<p class="sub">${esc(DATA.subtitle)}</p>`:''}${chips?`<div class="metachips">${chips}</div>`:''}${DATA.summary?`<div class="prose" style="margin-top:14px">${md(DATA.summary)}</div>`:''}`));
  // blocks
  const frag=document.createElement('div');frag.innerHTML=blocks.map(render).join('');
  while(frag.firstChild)c.appendChild(frag.firstChild);
  buildTOC();renderMermaid();initAnno();bindTabs();
}
function buildTOC(){
  const toc=$('#toc');(DATA.blocks||[]).filter(b=>b.type==='heading').forEach(b=>{const id=b.id||slug(b.text);const a=el('a',b.level===3?'lvl2':'',esc(b.text));a.href='#'+id;toc.appendChild(a);});
  // scroll spy
  const links=[...toc.querySelectorAll('a')];const map={};links.forEach(a=>map[a.getAttribute('href').slice(1)]=a);
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.remove('active'));const a=map[e.target.id];if(a)a.classList.add('active');}});},{rootMargin:'-60px 0px -75% 0px'});
  document.querySelectorAll('h2.bh,h3.bh').forEach(h=>io.observe(h));
}
function bindTabs(){document.addEventListener('click',e=>{const b=e.target.closest('.tabbtn');if(!b)return;const id=b.dataset.t,i=b.dataset.i;document.querySelectorAll(`.tabbtn[data-t="${id}"]`).forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll(`[id^="${id}-"]`).forEach(p=>p.classList.toggle('active',p.id===`${id}-${i}`));});}
function renderMermaid(){if(window.mermaid){try{mermaid.initialize({startOnLoad:false,theme:document.documentElement.dataset.theme==='light'?'default':'dark',securityLevel:'loose'});const run=mermaid.run({querySelector:'.mermaid'});if(run&&run.then)run.then(setupDiagramLinks);else setTimeout(setupDiagramLinks,60);}catch(e){}}else{document.querySelectorAll('.mermaid').forEach(m=>{m.outerHTML=`<pre class="code" style="padding:12px">${esc(m.textContent)}</pre>`;});}}
function setupDiagramLinks(){
  document.querySelectorAll('.diagwrap[data-links]').forEach(wrap=>{
    let links={};try{links=JSON.parse(wrap.dataset.links);}catch(e){return;}
    wrap.querySelectorAll('.node,.nodeLabel').forEach(node=>{const g=node.closest('.node')||node;if(g.dataset.bound)return;const t=(g.textContent||'').trim();
      for(const key in links){if(t===key||t.indexOf(key)>-1){g.classList.add('jump');g.dataset.bound='1';g.addEventListener('click',ev=>{ev.stopPropagation();flashBlock(links[key]);});break;}}});
  });
}
function flashBlock(id){const t=document.querySelector(`[data-bid="${id}"]`)||document.getElementById(id);if(!t)return;
  // if target sits in a hidden tab pane, activate it first
  const pane=t.closest('.tabpane');if(pane&&!pane.classList.contains('active')){const idx=pane.id.split('-').pop();const tid=pane.id.replace(/-\d+$/,'');const btn=document.querySelector(`.tabbtn[data-t="${tid}"][data-i="${idx}"]`);if(btn)btn.click();}
  t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash');}

/* ---------- interactive code & diff & diagram handlers (event delegation) ---------- */
function copyText(text,btn){const done=()=>{const o=btn.textContent;btn.textContent='✓ Copied';setTimeout(()=>btn.textContent=o,1100);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done).catch(()=>{});else done();}
function runCode(card){const lang=(card.dataset.lang||'').toLowerCase();const ta=card.querySelector('.editor');const code=ta?ta.value:decodeURIComponent(card.dataset.raw||'');
  let doc;if(lang==='html')doc=code;else if(lang==='css')doc=`<style>${code}</style><p style="font:13px sans-serif;color:#555">CSS applied — add markup in the snippet to see it styled.</p>`;
  else doc=`<!doctype html><body style="font:13px ui-monospace,monospace;margin:8px"><script>(function(){var log=function(){document.body.appendChild(Object.assign(document.createElement('div'),{textContent:[].slice.call(arguments).join(' ')}));};console.log=log;try{${code}}catch(e){document.body.innerHTML='<pre style="color:#c00">'+e+'</pre>';}})();<\/script></body>`;
  const out=card.querySelector('.runout');out.classList.remove('hidden');out.querySelector('iframe').srcdoc=doc;}
document.addEventListener('click',e=>{
  const copy=e.target.closest('[data-copy]');if(copy){const card=copy.closest('.card');const ta=card.querySelector('.editor');copyText(ta?ta.value:decodeURIComponent(card.dataset.raw||''),copy);return;}
  const run=e.target.closest('[data-run]');if(run){runCode(run.closest('.card'));return;}
  const cr=e.target.closest('[data-closerun]');if(cr){cr.closest('.runout').classList.add('hidden');return;}
  const rst=e.target.closest('[data-reset]');if(rst){const ta=rst.closest('.card').querySelector('.editor');if(ta)ta.value=decodeURIComponent(ta.dataset.init||'');return;}
  const sp=e.target.closest('[data-split]');if(sp){const card=sp.closest('.diff');const on=card.classList.toggle('split');sp.textContent=on?'▤ Unified':'⊟ Split';return;}
  const ex=e.target.closest('.ctxexp');if(ex){const id=ex.dataset.exp;const mid=ex.closest('.card').querySelector(`[data-mid="${id}"]`);if(mid)mid.classList.remove('hidden');ex.classList.add('hidden');return;}
  const z=e.target.closest('[data-z]');if(z){zoomDiagram(z.closest('.diagwrap'),z.dataset.z);return;}
});
/* diagram pan + zoom */
function applyT(w){const t=w._t||(w._t={x:0,y:0,s:1});w.querySelector('.pz').style.transform=`translate(${t.x}px,${t.y}px) scale(${t.s})`;}
function zoomDiagram(w,act){const t=w._t||(w._t={x:0,y:0,s:1});
  if(act==='in')t.s=Math.min(4,t.s*1.25);else if(act==='out')t.s=Math.max(.3,t.s/1.25);
  else if(act==='reset'){t.x=0;t.y=0;t.s=1;}else if(act==='full'){w.classList.toggle('full');return;}applyT(w);}
document.addEventListener('mousedown',e=>{const w=e.target.closest('.diagwrap');if(!w||e.target.closest('.diagtools')||e.target.closest('.jump'))return;const t=w._t||(w._t={x:0,y:0,s:1});w._drag={px:e.clientX,py:e.clientY,ox:t.x,oy:t.y};w.classList.add('drag');});
document.addEventListener('mousemove',e=>{const w=document.querySelector('.diagwrap.drag');if(!w||!w._drag)return;const t=w._t;t.x=w._drag.ox+(e.clientX-w._drag.px);t.y=w._drag.oy+(e.clientY-w._drag.py);applyT(w);});
document.addEventListener('mouseup',()=>{document.querySelectorAll('.diagwrap.drag').forEach(w=>{w.classList.remove('drag');w._drag=null;});});
document.addEventListener('wheel',e=>{const w=e.target.closest('.diagwrap');if(!w)return;e.preventDefault();const t=w._t||(w._t={x:0,y:0,s:1});t.s=Math.max(.3,Math.min(4,t.s*(e.deltaY<0?1.1:0.9)));applyT(w);},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.diagwrap.full').forEach(w=>w.classList.remove('full'));});

/* ---------- theme ---------- */
$('#theme').onclick=()=>{const h=document.documentElement;const cur=h.dataset.theme;const next=cur==='light'?'dark':cur==='dark'?'auto':'light';h.dataset.theme=next;try{localStorage.setItem('vp-theme',next);}catch(e){}renderMermaid();};
try{const t=localStorage.getItem('vp-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
$('#print').onclick=()=>window.print();

/* ---------- search ---------- */
const qin=$('#q');
qin.addEventListener('input',()=>{const term=qin.value.trim().toLowerCase();const blocks=document.querySelectorAll('#content .block');document.querySelectorAll('mark').forEach(m=>m.replaceWith(m.textContent));if(!term){blocks.forEach(b=>b.classList.remove('hidden'));return;}blocks.forEach(b=>{const hit=b.textContent.toLowerCase().includes(term);b.classList.toggle('hidden',!hit);});});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==qin){e.preventDefault();qin.focus();}if(e.key==='Escape'){qin.value='';qin.dispatchEvent(new Event('input'));}});

/* ---------- annotations (round-trip loop) ---------- */
const AK='vp-anno-'+(DATA.id||DATA.title||'doc');
let ANN=[];try{ANN=JSON.parse(localStorage.getItem(AK)||'[]');}catch(e){}
function saveAnn(){try{localStorage.setItem(AK,JSON.stringify(ANN));}catch(e){}refreshAnn();}
function refreshAnn(){
  $('#annocount').textContent=ANN.length;
  document.querySelectorAll('.annobtn').forEach(btn=>{const bid=btn.closest('.block').dataset.bid;btn.classList.toggle('has',ANN.some(a=>a.block===bid));});
  const list=$('#annolist');
  list.innerHTML=ANN.length?ANN.map((a,i)=>`<div class="annoitem"><span class="x" data-i="${i}">✕</span>${esc(a.text)}<div class="meta">@ ${esc(a.label||a.block)}</div></div>`).join(''):'<div class="empty">No notes yet. Turn on ✎ Annotate and click any block.</div>';
}
$('#anno').onclick=()=>{document.body.classList.toggle('annomode');$('#anno').classList.toggle('on');$('#annopanel').classList.toggle('open');refreshAnn();};
$('#content').addEventListener('click',e=>{const btn=e.target.closest('.annobtn');if(!btn||!document.body.classList.contains('annomode'))return;const block=btn.closest('.block');const bid=block.dataset.bid;const label=(block.querySelector('h2,h3,.hd,.ti,.choice,.qq')||{}).textContent||bid;const txt=prompt('Note for "'+label.trim().slice(0,60)+'":');if(txt){ANN.push({block:bid,label:label.trim().slice(0,80),text:txt,ts:new Date().toISOString()});saveAnn();}});
$('#annolist').addEventListener('click',e=>{const x=e.target.closest('.x');if(!x)return;ANN.splice(+x.dataset.i,1);saveAnn();});
$('#annoexport').onclick=()=>{const blob=new Blob([JSON.stringify({artifact:DATA.title,kind:DATA.kind,notes:ANN},null,2)],{type:'application/json'});const a=el('a');a.href=URL.createObjectURL(blob);a.download=(slug(DATA.title||'artifact'))+'-notes.json';a.click();};
$('#annocopy').onclick=async()=>{const t=ANN.map(a=>`- [${a.label}] ${a.text}`).join('\n');try{await navigator.clipboard.writeText(`Review notes on "${DATA.title}":\n${t}`);$('#annocopy').textContent='✓ Copied';setTimeout(()=>$('#annocopy').innerHTML='⧉ Copy',1200);}catch(e){alert(t);}};
function initAnno(){refreshAnn();}

build();
</script>
</body>
</html>
